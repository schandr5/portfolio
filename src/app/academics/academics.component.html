<!-- Academics Header -->
<div class="academics-header">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8 text-center">
        <h1 class="page-title">Education</h1>
      </div>
    </div>
  </div>
</div>

<!-- Academics Section -->
<div class="academics-section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="academics-grid">
          <div 
            *ngFor="let academic of academics; let i = index" 
            class="academic-card"
            [class.featured]="i === 0"
            [style.animation-delay]="(i * 0.2) + 's'">
            
            <div class="academic-card-header">
              <div class="university-logo">
                <i [class]="academic.icon"></i>
              </div>
              <div class="academic-badge" *ngIf="i === 0">
                <span class="badge featured-badge">Latest</span>
              </div>
            </div>
            
            <div class="academic-card-body">
              <h3 class="university-name">{{ academic.title }}</h3>
              <h4 class="degree-title">{{ academic.degree }}</h4>
              <span class="academic-duration">{{ academic.date }}</span>
              
              <div class="academic-details">
                <div class="detail-item" *ngIf="academic.location">
                  <i class="bi bi-geo-alt"></i>
                  <span>{{ academic.location }}</span>
                </div>
                <div class="detail-item" *ngIf="academic.focus">
                  <i class="bi bi-lightbulb"></i>
                  <span>Focus: {{ academic.focus }}</span>
                </div>
              </div>
            </div>
            
            <div class="academic-card-footer">
              <div class="achievements" *ngIf="academic.achievements">
                <h5 class="achievements-title">Key Achievements</h5>
                <ul class="achievements-list">
                  <li *ngFor="let achievement of academic.achievements" class="achievement-item">
                    <i class="bi bi-check-circle-fill"></i>
                    <span>{{ achievement }}</span>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
