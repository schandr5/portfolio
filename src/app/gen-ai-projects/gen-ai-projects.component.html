<!-- Gen AI Projects Header -->
<div class="gen-ai-projects-header">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8 text-center">
        <h1 class="page-title">{{ t.title }}</h1>
      </div>
    </div>
  </div>
</div>

<!-- Gen AI Projects Grid -->
<div class="gen-ai-projects-section">
  <div class="container">
    <div class="row">
      <div class="col-lg-6 col-md-6 mb-4" *ngFor="let project of projects; let i = index">
        <div class="project-card" [class.featured]="i === 0">
          <div class="project-card-header">
            <div class="project-icon">
              <i class="pi pi-sparkles"></i>
            </div>
            <div class="project-badge" *ngIf="i === 0">
              <span class="badge featured-badge">{{ t.latest }}</span>
            </div>
          </div>
          
          <div class="project-card-body">
            <h3 class="project-title">{{ project.title }}</h3>
            <span class="project-date">{{ project.date }}</span>
            
            <div class="project-description">
              <h5 class="description-title">{{ t.projectHighlights }}</h5>
              <ul class="project-features">
                <li *ngFor="let point of project.details" class="feature-item">
                  <i class="bi bi-arrow-right-circle-fill"></i>
                  <span>{{ point }}</span>
                </li>
              </ul>
            </div>
          </div>
          
          <div class="project-card-footer">
            <div class="tech-stack">
              <span class="tech-tag" *ngFor="let tech of project.techStack">{{ tech }}</span>
            </div>
            <div class="project-links" *ngIf="project.githubUrl">
              <a [href]="project.githubUrl" target="_blank" class="github-link">
                <i class="bi bi-github"></i>
                <span>View on GitHub</span>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
